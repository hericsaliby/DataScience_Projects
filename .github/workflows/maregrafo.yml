name: Marégrafo EPAGRI
on:
  push:
    branches: [pesqueiro-floripa]
    paths: [".github/workflows/maregrafo.yml", "tools/maregrafo.py"]
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
concurrency: maregrafo
jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pesqueiro-floripa
      - name: Baixa a página dos marégrafos
        run: |
          mkdir -p data
          rm -f data/maregrafo_raw.html
          for e in "floripa getDataMare3_2951" "imbituba getDataMare6_2963"; do set -- $e
            curl -sSL -D "data/$1_headers.txt" -A "Mozilla/5.0 (pesqueiro-floripa)" -m 60 "https://ciram.epagri.sc.gov.br/graficos/$2.php" -o "data/$1_raw.json" || true
          done
          ls -la data
      - name: Extrai os dados
        run: python3 tools/maregrafo.py data data/maregrafo.json || true
      - name: Salva no repositório
        run: |
          git config user.name "pesqueiro-bot"
          git config user.email "pesqueiro-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Atualiza marégrafo EPAGRI" && git pull --rebase origin pesqueiro-floripa && git push origin HEAD:pesqueiro-floripa)
